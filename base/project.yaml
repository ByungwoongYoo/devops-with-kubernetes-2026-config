apiVersion: v1
kind: ConfigMap
metadata:
  name: project-config
data:
  TODO_APP_PORT: "3000"
  TODO_BACKEND_PORT: "3000"
  IMAGE_FILE: /usr/src/app/files/image.jpg
  IMAGE_CACHE_TTL_MS: "600000"
  TODO_BACKEND_URL: http://todo-backend-svc:2345
  PICSUM_URL: https://picsum.photos/1200
  WIKIPEDIA_RANDOM_URL: https://en.wikipedia.org/wiki/Special:Random
  MAX_TODO_LENGTH: "140"
  REQUEST_BODY_LIMIT_BYTES: "10000"
  DATABASE_HOST: todo-postgres-svc
  DATABASE_PORT: "5432"
  DATABASE_NAME: todos
  DATABASE_USER: postgres
  BACKUP_BUCKET: dwk-todo-backups-588051040645
  NATS_URL: nats://nats-svc:4222
  NATS_SUBJECT: todo.events
  NATS_QUEUE: todo-broadcasters
  BROADCAST_MODE: forward
  BROADCAST_URL: https://httpbin.org/post
  BROADCAST_USER: bot
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-image-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-image-claim
      containers:
        - name: todo-app
          image: PROJECT/TODO_APP
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: TODO_APP_PORT
            - name: IMAGE_FILE
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: IMAGE_FILE
            - name: IMAGE_CACHE_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: IMAGE_CACHE_TTL_MS
            - name: TODO_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: TODO_BACKEND_URL
            - name: PICSUM_URL
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: PICSUM_URL
            - name: MAX_TODO_LENGTH
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: MAX_TODO_LENGTH
            - name: REQUEST_BODY_LIMIT_BYTES
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: REQUEST_BODY_LIMIT_BYTES
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
---
apiVersion: v1
kind: Service
metadata:
  name: todo-app-svc
spec:
  type: LoadBalancer
  selector:
    app: todo-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: PROJECT/TODO_BACKEND
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: TODO_BACKEND_PORT
            - name: MAX_TODO_LENGTH
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: MAX_TODO_LENGTH
            - name: REQUEST_BODY_LIMIT_BYTES
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: REQUEST_BODY_LIMIT_BYTES
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: NATS_URL
            - name: NATS_SUBJECT
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: NATS_SUBJECT
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 35
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend-svc
spec:
  type: ClusterIP
  selector:
    app: todo-backend
  ports:
    - name: http
      protocol: TCP
      port: 2345
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: todo-postgres-svc
  labels:
    app: todo-postgres
spec:
  clusterIP: None
  selector:
    app: todo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: todo-postgres
spec:
  serviceName: todo-postgres-svc
  replicas: 1
  selector:
    matchLabels:
      app: todo-postgres
  template:
    metadata:
      labels:
        app: todo-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.0
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "todos"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: ["--server_name", "todo-nats"]
          ports:
            - containerPort: 4222
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nats-svc
spec:
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-broadcaster-dep
spec:
  replicas: 6
  selector:
    matchLabels:
      app: todo-broadcaster
  template:
    metadata:
      labels:
        app: todo-broadcaster
    spec:
      containers:
        - name: broadcaster
          image: PROJECT/TODO_BROADCASTER
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: NATS_URL
            - name: NATS_SUBJECT
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: NATS_SUBJECT
            - name: NATS_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: NATS_QUEUE
            - name: BROADCAST_MODE
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: BROADCAST_MODE
            - name: BROADCAST_URL
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: BROADCAST_URL
            - name: BROADCAST_USER
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: BROADCAST_USER
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-todo
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: todo-generator
              image: PROJECT/TODO_GENERATOR
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "25m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
              env:
                - name: TODO_BACKEND_URL
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: TODO_BACKEND_URL
                - name: WIKIPEDIA_RANDOM_URL
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: WIKIPEDIA_RANDOM_URL
                - name: MAX_TODO_LENGTH
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: MAX_TODO_LENGTH
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-backup-ksa
  annotations:
    iam.gke.io/gcp-service-account: todo-backup-sa@dwk-gke-508806.iam.gserviceaccount.com
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-db-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: todo-backup-ksa
          restartPolicy: OnFailure
          volumes:
            - name: backup-data
              emptyDir: {}
          initContainers:
            - name: pg-dump
              image: postgres:18.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  export PGPASSWORD="$DATABASE_PASSWORD"
                  pg_dump -h "$DATABASE_HOST" -p "$DATABASE_PORT" -U "$DATABASE_USER" "$DATABASE_NAME" | gzip > "/backup/todos-${stamp}.sql.gz"
              env:
                - name: DATABASE_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: DATABASE_HOST
                - name: DATABASE_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: DATABASE_PORT
                - name: DATABASE_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: DATABASE_NAME
                - name: DATABASE_USER
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: DATABASE_USER
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: project-postgres-secret
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
          containers:
            - name: upload
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  file=$(ls /backup/*.sql.gz | head -n 1)
                  gcloud storage cp "$file" "gs://${BACKUP_BUCKET}/$(basename "$file")"
                  echo "backup_uploaded $(basename "$file")"
              env:
                - name: BACKUP_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: BACKUP_BUCKET
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
